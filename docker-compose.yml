services:
  mamachapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamachapp-bot
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - CONFIG_PATH=/app/data/config.json
